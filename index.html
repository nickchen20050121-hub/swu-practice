<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SWU 練牌桌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 版面概念：全息投影桌。上方敵方、下方我方，每一側都是「地面戰區｜基地＋領袖｜太空戰區」三欄，中間一條指令列。 */
:root{
  --bg:#e8f1f5; --panel:#ffffff; --panel2:#f3f8fb; --ink:#10233d; --muted:#5a6d82; --line:#cbdbe5;
  --accent:#2a96bf; --accent2:#0f5c7d; --accent-ink:#ffffff; --glow:rgba(42,150,191,.35);
  --good:#2b8a5e; --bad:#c4473c; --warn:#cf7a22; --me:#2a96bf; --them:#b5577a;
  --vig:#3b78d6; --cmd:#3b9653; --agg:#d0463a; --cun:#ddb02c; --her:#efe9d8; --vil:#26262c;
  --f-display:"Chakra Petch","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px; --cw:78px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0a1523; --panel:#112235; --panel2:#0e1c2d; --ink:#e3edf5; --muted:#8ea3b7; --line:#21374d;
  --accent:#58c3e6; --accent2:#9adcf2; --accent-ink:#06202d; --glow:rgba(88,195,230,.35);
  --good:#4cc08a; --bad:#ef6f62; --warn:#f0a050; --me:#58c3e6; --them:#e08aac; --her:#e9e2cc; --vil:#4a4a55; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a1523; --panel:#112235; --panel2:#0e1c2d; --ink:#e3edf5; --muted:#8ea3b7; --line:#21374d;
  --accent:#58c3e6; --accent2:#9adcf2; --accent-ink:#06202d; --glow:rgba(88,195,230,.35);
  --good:#4cc08a; --bad:#ef6f62; --warn:#f0a050; --me:#58c3e6; --them:#e08aac; --her:#e9e2cc; --vil:#4a4a55; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-body)}
body{min-height:100vh}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.ghost{background:transparent}
button.danger{border-color:var(--bad);color:var(--bad);background:transparent}
button.warnbtn{border-color:var(--warn)}
button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
button.big{padding:12px 28px;font-size:16px}
button.small{padding:3px 8px;font-size:12px}
button.wide{width:100%}
button.left{text-align:left}
button.mini{padding:0 7px;font-size:13px;line-height:22px;border-radius:6px}
select,input[type=text],input[type=password],input[type=number],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;max-width:100%}
textarea{width:100%;resize:vertical}
h2,h3,h4{font-family:var(--f-display);margin:0 0 8px;text-wrap:balance;letter-spacing:.02em}
h3{font-size:15px} h4{font-size:13px;margin-top:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.muted{color:var(--muted)} .small{font-size:12px} .err{color:var(--bad)} .ok{color:var(--good)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .row.end{justify-content:flex-end} .row.wrap{flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}

/* 頂列 */
header.top{display:flex;align-items:center;gap:16px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.04em}
.mark{width:22px;height:22px;border-radius:50% 50% 50% 4px;background:conic-gradient(from 200deg,var(--accent),#0f2b4a,var(--accent));box-shadow:0 0 12px var(--glow)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:transparent;border-color:transparent;font-family:var(--f-display);font-weight:500}
.tab.on{background:var(--panel2);border-color:var(--line);color:var(--accent2)}
.lang{margin-left:auto;font-family:var(--f-num);font-size:12px}
main#view{padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}

/* 卡面 */
.face{position:relative;width:var(--cw);aspect-ratio:5/7;border-radius:6px;overflow:hidden;background:var(--panel2);max-width:100%}
.face.wide{aspect-ratio:7/5;width:calc(var(--cw)*1.4)}
.face.small{--cw:58px}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:0;padding:4px 5px;display:flex;flex-direction:column;gap:1px;font-size:9px;line-height:1.25;border:2px solid var(--line);border-radius:6px;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.frame.vig{border-color:var(--vig)} .frame.cmd{border-color:var(--cmd)} .frame.agg{border-color:var(--agg)} .frame.cun{border-color:var(--cun)} .frame.her{border-color:#bfb79d} .frame.vil{border-color:var(--vil)}
.fr-top{display:flex;justify-content:space-between;align-items:center}
.fr-cost{font-family:var(--f-num);background:var(--ink);color:var(--panel);border-radius:50%;width:16px;height:16px;display:grid;place-items:center;font-size:10px}
.fr-name{font-weight:700;font-size:10px}
.fr-sub{color:var(--muted);font-size:8px}
.fr-text{flex:1;overflow:hidden;color:var(--muted)}
.fr-stats{display:flex;justify-content:space-between;font-family:var(--f-num);font-weight:700;font-size:11px}
.fr-stats .pw{color:var(--agg)} .fr-stats .hpv{color:var(--vig)}
.asp{display:inline-flex;gap:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.dot.vig{background:var(--vig)} .dot.cmd{background:var(--cmd)} .dot.agg{background:var(--agg)} .dot.cun{background:var(--cun)} .dot.her{background:var(--her)} .dot.vil{background:var(--vil)}

/* 大廳 */
.vs{font-family:var(--f-display);font-size:28px;color:var(--accent);align-self:center}
.home{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;gap:18px;justify-items:center}
.home-title{font-family:var(--f-display);margin:0}
.modecards{display:grid;grid-template-columns:repeat(3,minmax(0,260px));gap:18px;width:100%;justify-content:center}
.modecard{position:relative;padding:0;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);aspect-ratio:3/4;display:flex;flex-direction:column;cursor:pointer;text-align:left;transition:transform .15s,border-color .15s,box-shadow .15s}
.modecard:hover,.modecard:focus-visible{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 24px var(--glow)}
.mc-art{flex:1;position:relative;background:linear-gradient(160deg,var(--accent2),var(--vil));overflow:hidden}
.modecard.bo3 .mc-art{background:linear-gradient(160deg,var(--agg),var(--vil))}
.modecard.build .mc-art{background:linear-gradient(160deg,var(--cmd),var(--accent2))}
.mc-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:28% 30%}
.mc-txt{display:grid;gap:4px;padding:12px 14px;background:var(--panel)}
.mc-txt b{font-family:var(--f-display);font-size:20px}
.mc-txt span{color:var(--muted);font-size:13px}
.qm{max-width:1400px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:18px;align-items:start}
.qm-left{min-width:0}
.qm-left h3{margin:14px 0 8px}
.qm-head{display:flex;align-items:center;gap:6px;font-size:18px}
.qm-head .sep{color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;cursor:pointer}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.dtile{position:relative;padding:0;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;cursor:pointer;color:var(--ink)}
.dtile:hover,.dtile:focus-visible{border-color:var(--accent)}
.dtile.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow)}
.dart{position:relative;aspect-ratio:4/3;overflow:hidden;display:grid;place-items:center;background:linear-gradient(160deg,var(--panel2),var(--line))}
.dart.vig{background:linear-gradient(160deg,var(--vig),#1b2f55)} .dart.cmd{background:linear-gradient(160deg,var(--cmd),#163a24)} .dart.agg{background:linear-gradient(160deg,var(--agg),#4a1612)} .dart.cun{background:linear-gradient(160deg,var(--cun),#5a4410)} .dart.her{background:linear-gradient(160deg,#d8cfb4,#7d7458)} .dart.vil{background:linear-gradient(160deg,#55555f,#16161a)}
.dart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:22% 30%}
.dart-n{color:#fff;font-weight:700;font-size:13px;padding:6px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.dart .plus{font-size:40px;color:var(--muted)}
.dtile-n{display:block;padding:6px 8px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.dtile-warn{position:absolute;left:6px;top:6px;background:var(--warn);color:#fff;border-radius:6px;padding:0 5px;font-size:12px}
.pbadges{position:absolute;right:6px;top:6px;display:flex;gap:4px}
.pbadge{display:inline-block;padding:2px 6px;border-radius:6px;font-family:var(--f-num);font-size:12px;color:#fff}
.pbadge.p1{background:#2a5bd7} .pbadge.p2{background:#c4473c}
.qm-right{position:sticky;top:12px;display:grid;gap:10px}
.qm-title{margin:4px 0;text-align:center;font-family:var(--f-display)}
.vsrow{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.vslot{display:grid;gap:4px;justify-items:center;text-align:center;min-width:0}
.vslot-art{position:relative;width:100%;max-width:170px;border-radius:10px;overflow:hidden;border:2px solid var(--line)}
.vslot-art .pbadge{position:absolute;left:6px;top:6px}
.vslot-who{font-weight:700}
.vslot-n{font-size:13px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vsbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lvrow{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.lvbtn{padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-family:var(--f-num);font-weight:700;cursor:pointer}
.lvbtn.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.lvdesc{font-size:13px;color:var(--muted)}
.lvdesc b{color:var(--ink)}
.aiopt-lbl{font-weight:700}
.aiopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.aiopt{display:grid;gap:4px;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer}
.aiopt span{font-size:12px;color:var(--muted)}
.aiopt.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.aiopt.on span{color:rgba(255,255,255,.85)}
.deckview{max-width:760px;width:calc(100vw - 32px)}
.dv-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dv-head h3{margin:0;min-width:0;overflow-wrap:anywhere}
.dv-headbtns{display:flex;gap:6px;flex:none;align-items:center}
.dimgbtn{white-space:nowrap}
.dv-meta{display:grid;gap:4px}
.dv-meta i{color:var(--muted)}
.dv-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));column-gap:24px;align-items:start;max-height:52vh;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
.dl-sec{break-inside:avoid;margin-bottom:10px}
.dl-sec h4{margin:4px 0}
.dl-sec ul{list-style:none;margin:0;padding:0}
.dl-sec li{display:flex;gap:6px;align-items:center;font-size:13px;padding:5px 8px;margin:3px 0;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:zoom-in}
[data-zoom]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dl-sec li .asp{margin-left:auto;padding:4px 6px;border-left:1px solid var(--line)}
.dl-sec .qty{font-family:var(--f-num);width:26px}
.dl-c{font-family:var(--f-num);color:var(--muted);width:16px;text-align:right}
.dl-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-btns{flex-wrap:wrap;justify-content:flex-end}
.dv-btns button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:640px){.dv-list{grid-template-columns:1fr;max-height:48vh;overflow-x:hidden}.dl-n{white-space:normal}}
@media (max-width:900px){.qm{grid-template-columns:1fr}.qm-right{position:static}}
@media (max-width:640px){.modecards{grid-template-columns:1fr;max-width:360px}.modecard{aspect-ratio:auto}.mc-art{height:150px;flex:none}.dgrid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.vs{font-size:20px}}
.ai-status{margin:0;padding:8px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.ai-status.on{border-color:var(--good)}

/* 對戰桌 */
.table-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:1100px){.table-wrap{grid-template-columns:1fr}}
.board{display:grid;gap:10px;min-width:0;background:radial-gradient(ellipse at 50% 50%,var(--glow),transparent 70%),var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--f-num);font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel2)}
.chip.me{border-color:var(--me)} .chip.them{border-color:var(--them)}
.turn{margin-left:auto;font-family:var(--f-display);font-weight:700}
.turn.me{color:var(--me)} .turn.them{color:var(--them)}
.zone{display:grid;gap:6px;padding:8px;border-radius:10px;border:1px dashed var(--line)}
.zone.p0{border-color:color-mix(in srgb,var(--me) 45%,transparent)} .zone.p1{border-color:color-mix(in srgb,var(--them) 45%,transparent)}
.zone.p1{order:0}
.pinfo{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:12px}
.pname{font-family:var(--f-display);font-size:14px}
.zone.p0 .pname{color:var(--me)} .zone.p1 .pname{color:var(--them)}
.stat b{font-family:var(--f-num)}
.stat.force{color:var(--accent2);font-weight:700}
.lanes{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.lane{position:relative;min-height:calc(var(--cw)*1.4 + 18px);border-radius:8px;background:var(--panel2);padding:16px 6px 6px;min-width:0}
.lane-label{position:absolute;top:2px;left:8px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--f-display)}
.lane.space{background:linear-gradient(135deg,var(--panel2),color-mix(in srgb,var(--accent) 8%,var(--panel2)))}
.units{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}
.center{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center}
.zone.p0 .center{flex-direction:column-reverse}
.basecard,.leadercard{position:relative;cursor:default;border-radius:8px}
.basehp{position:absolute;right:-6px;bottom:-6px;background:var(--ink);color:var(--panel);font-family:var(--f-num);border-radius:8px;padding:1px 7px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.basehp b{font-size:16px} .basehp.low{background:var(--bad);color:#fff}
.leadercard .badge{position:absolute;top:-6px;right:-6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;font-size:10px;padding:0 6px;font-family:var(--f-num)}
.leadercard.deployed{opacity:.5}
.unit{position:relative;border-radius:7px;transition:transform .15s,box-shadow .15s}
.unit.exhausted .face,.leadercard.exhausted .face{transform:rotate(8deg);filter:grayscale(.55) brightness(.85)}
.unit.leaderunit .face{box-shadow:0 0 0 2px var(--cun)}
.unit .face.wide{aspect-ratio:5/7;width:var(--cw)}
.unit .face.wide img{object-position:50% 40%}
body.sideopen .logbtn,body.sideopen .fulllog{background:var(--accent2)!important;border-color:var(--accent2)!important;color:#fff!important;box-shadow:0 0 0 3px rgba(80,180,255,.35),0 0 14px rgba(80,180,255,.6);animation:logGlow 1.6s ease-in-out infinite}
@keyframes logGlow{50%{box-shadow:0 0 0 3px rgba(80,180,255,.15),0 0 22px rgba(80,180,255,.9)}}
.intro{position:fixed;inset:0;z-index:200;background:radial-gradient(ellipse at center,rgba(20,30,60,.92),rgba(5,8,20,.97));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;cursor:pointer;animation:introIn .35s ease-out;padding:16px}
.intro.out{opacity:0;transition:opacity .4s}
.introside{display:flex;flex-direction:column;align-items:center;gap:6px}
.introside.them{animation:introDown .6s ease-out}
.introside.me{animation:introUp .6s ease-out}
.introname{font-weight:700;font-size:18px;letter-spacing:.05em}
.introcards{display:flex;gap:10px;align-items:center}
.introcards .face{color:var(--ink);--cw:clamp(110px,22vw,170px);box-shadow:0 6px 24px rgba(0,0,0,.5);filter:none}
.introvs{font-size:clamp(28px,7vw,52px);font-weight:900;color:#ffd54a;text-shadow:0 0 18px rgba(255,200,40,.7);animation:introPop .5s .3s both}
.introcoin{font-size:18px;font-weight:700;opacity:.6;min-height:1.4em}
.introcoin.on{opacity:1;animation:introPop .4s both}
.introcoin.me{color:#7fe3ff}.introcoin.them{color:#ff9db0}
.introskip{opacity:.5}
@keyframes introIn{from{opacity:0}to{opacity:1}}
@keyframes introDown{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes introUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes introPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (max-height:700px){.introcards .face{--cw:clamp(80px,18vw,120px)}}
.mullopp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px;margin:-4px 0 8px;border-radius:10px;background:var(--panel2)}
.mulloppcards{cursor:pointer}
.mulloppcards .face{--cw:62px;filter:none}
.mullinfo{flex:1;min-width:120px;line-height:1.3}
.mullback{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:150;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.mulldlg{max-width:min(960px,96vw)!important;width:auto!important}
.mullhand{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:6px 0 14px}
.mullhand .face{--cw:clamp(92px,13vw,138px);box-shadow:0 4px 14px rgba(0,0,0,.35);filter:none}
.mullbtns{display:flex;gap:10px;justify-content:center}
.mullbtns button{min-width:140px}
.can,.act{cursor:pointer}
.can .face,.can.basecard .face{box-shadow:0 0 0 2px var(--warn),0 0 14px var(--warn)}
.act .face{box-shadow:0 0 0 2px var(--accent),0 0 12px var(--glow)}
.act:hover,.can:hover{transform:translateY(-3px)}
.sel .face{box-shadow:0 0 0 3px var(--good),0 0 16px var(--good)!important}
